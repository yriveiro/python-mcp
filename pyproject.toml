[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "python-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for Python code-quality checks with token-efficient output"
readme = "README.md"
license = { text = "MIT" }
authors = [ { name = "Yago Riveiro", email = "yago.riveiro@gmail.com" } ]
requires-python = ">=3.14"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "fastmcp>=3.4.6,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.14.2",
  "rich>=15.0.0",
  "typer>=0.27.1",
]
urls."Bug Tracker" = "https://github.com/yriveiro/python-mcp/issues"
urls.Homepage = "https://github.com/yriveiro/python-mcp"
scripts.python-mcp = "python_mcp.cli:run"
scripts.python_mcp = "python_mcp.cli:run"

[dependency-groups]
dev = [
  "bandit>=1.9.4",
  "codespell>=2.4.3",
  "deptry>=0.25.1",
  "pydoclint>=0.9.1",
  "pyproject-fmt>=2.27",
  "pytest>=9.1.1",
  "ruff",
  "ty",
  "vulture",
]

[tool.hatch]
build.sources.src = "src"
build.targets.wheel.packages = [ "src/python_mcp" ]

[tool.ruff]
target-version = "py314"
line-length = 88
format.quote-style = "double"
lint.select = [ "B", "E", "F", "I", "SIM", "UP" ]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.python_files = "test_*.py"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
exclude = '\.git|\.tox|\.venv|^venv|node_modules'
